# M0.10 — CI: unit tests, lint, bundle-size budget.
#
# The fast job is everything that needs no Docker and no browser, and doc 43
# says it should stay under a minute. The Docker-backed protocol conformance
# job (doc 43 §2, §3) runs separately because it pulls a real MySQL 8.4.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: lint, typecheck, test, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # D-01: type stripping without a build step needs >=22.18.
          node-version: '22.18'
          cache: npm
      - run: npm ci

      # Ground rule 1, enforced rather than intended.
      - name: isomorphic lint
        run: npm run lint

      # erasableSyntaxOnly: no enum, namespace, parameter properties, decorators.
      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # doc 43 §7 — the ratcheting budget.
      - name: bundle size budget
        run: npm run size

  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # Ground rule 5: a typed error, never a crash, never a hang.
      - name: Reader fuzz (10^6 inputs)
        run: npm run fuzz

  generated:
    name: generated tables are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # D-14: these tables are generated from MySQL's own source, never
      # transcribed. Ground rule 7: that source is fetched, never vendored.
      # Re-running must reproduce the committed output byte for byte.
      - name: regenerate the error table and diff
        run: |
          npm run gen:errors
          git diff --exit-code -- packages/protocol/src/errors/
      # M2.17 / D-33: one parse of MySQL's `CHARSET_INFO` definitions emits
      # both the full registry and the byte widths `@myjs/protocol` needs, so
      # the two cannot drift apart.
      # M2.5 adds a third emitted file to the same parse: the weight tables. It
      # carries the same source hash, so a drift in either is a drift in both.
      # B0 adds a fourth: the single-byte byte -> code point tables, which
      # exist because trusting this runner's `TextDecoder` for them was a real
      # corruption bug (E-11) rather than a hypothetical one.
      - name: regenerate the collation registry and weights and diff
        run: |
          npm run gen:charsets
          git diff --exit-code -- packages/charsets/src/registry.ts \
            packages/charsets/src/collations/weights.ts \
            packages/charsets/src/encodings.ts \
            packages/protocol/src/constants/charset-metrics.ts
      # M2.20: the UCA 9.0.0 tables are a separate parse of a separate file —
      # 7.4 MB of it — so they carry their own hash and their own step.
      - name: regenerate the UCA weights and diff
        run: |
          npm run gen:uca
          git diff --exit-code -- packages/charsets/src/collations/uca900.ts

  exit-criterion:
    name: the real mysql client connects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # The C client, not a JavaScript one: it sends
      # `SELECT @@version_comment LIMIT 1` before anything the user typed, it
      # does not set new_params_bind_flag on every execute, and over a plain
      # socket it will not hand over a password without RSA.
      - name: install the mysql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client
      - name: M1 exit criterion
        run: npm run exit-criterion

  trace-capture:
    name: re-capture traces against a real MySQL
    runs-on: ubuntu-latest
    # Not a gate: the committed fixtures are replayed by `npm test`. This job
    # exists so that a newer server's bytes are noticed rather than assumed.
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client
      - name: capture and diff
        run: |
          npm run capture:traces
          git diff --stat -- test/protocol/fixtures/

  type-vectors:
    name: re-capture storage vectors against a real MySQL
    runs-on: ubuntu-latest
    # M2.21 / D-34. Not a gate, for the same reason `trace-capture` is not: the
    # committed fixtures are replayed offline by `npm test`, and this job exists
    # so a newer server's bytes are noticed rather than assumed.
    #
    # It is also how the corpus is *created*. These vectors can only come from a
    # real 8.4, so the fixtures are uploaded as an artifact for a human to
    # commit rather than pushed from CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # `mysqlbinlog` ships in the client package.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client
      # Started here rather than as a `services:` container, because a service's
      # `options:` are passed to `docker create` — so `--binlog-row-image=FULL`
      # is read as a Docker flag and the container refuses to start with
      # "unknown flag: --log-bin". Server arguments have to follow the image
      # name, which only `docker run` allows.
      #
      # D-34 needs FULL row images: without them an INSERT logs only the columns
      # that changed and every captured vector would be silently partial.
      - name: start MySQL 8.4 with full row images
        run: |
          docker run -d --name mysql84 \
            -e MYSQL_ROOT_PASSWORD=root \
            -p 3306:3306 \
            mysql:8.4 \
            --log-bin=binlog --binlog-row-image=FULL --binlog-format=ROW --server-id=1
          for _ in $(seq 1 60); do
            if docker exec mysql84 mysqladmin ping -uroot -proot --silent 2>/dev/null; then
              echo 'mysqld is up'
              exit 0
            fi
            sleep 2
          done
          echo 'mysqld did not become ready'
          docker logs mysql84
          exit 1
      - name: capture and diff
        run: |
          npm run capture:types
          git diff --stat -- test/format/fixtures/
      - name: upload the captured fixtures
        uses: actions/upload-artifact@v4
        with:
          name: type-vectors
          path: test/format/fixtures/
          if-no-files-found: warn
