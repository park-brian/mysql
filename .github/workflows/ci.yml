# M0.10 — CI: unit tests, lint, bundle-size budget.
#
# The fast job is everything that needs no Docker and no browser, and doc 43
# says it should stay under a minute. The Docker-backed protocol conformance
# job (doc 43 §2, §3) runs separately because it pulls a real MySQL 8.4.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: lint, typecheck, test, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # D-01: type stripping without a build step needs >=22.18.
          node-version: '22.18'
          cache: npm
      - run: npm ci

      # Ground rule 1, enforced rather than intended.
      - name: isomorphic lint
        run: npm run lint

      # erasableSyntaxOnly: no enum, namespace, parameter properties, decorators.
      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # doc 43 §7 — the ratcheting budget.
      - name: bundle size budget
        run: npm run size

  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # Ground rule 5: a typed error, never a crash, never a hang.
      - name: Reader fuzz (10^6 inputs)
        run: npm run fuzz

  generated:
    name: generated tables are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # D-14: these tables are generated from MySQL's own source, never
      # transcribed. Ground rule 7: that source is fetched, never vendored.
      # Re-running must reproduce the committed output byte for byte.
      - name: regenerate the error table and diff
        run: |
          npm run gen:errors
          git diff --exit-code -- packages/protocol/src/errors/
      # M2.17 / D-33: one parse of MySQL's `CHARSET_INFO` definitions emits
      # both the full registry and the byte widths `@myjs/protocol` needs, so
      # the two cannot drift apart.
      - name: regenerate the collation registry and diff
        run: |
          npm run gen:charsets
          git diff --exit-code -- packages/charsets/src/registry.ts packages/protocol/src/constants/charset-metrics.ts

  exit-criterion:
    name: the real mysql client connects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # The C client, not a JavaScript one: it sends
      # `SELECT @@version_comment LIMIT 1` before anything the user typed, it
      # does not set new_params_bind_flag on every execute, and over a plain
      # socket it will not hand over a password without RSA.
      - name: install the mysql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client
      - name: M1 exit criterion
        run: npm run exit-criterion

  trace-capture:
    name: re-capture traces against a real MySQL
    runs-on: ubuntu-latest
    # Not a gate: the committed fixtures are replayed by `npm test`. This job
    # exists so that a newer server's bytes are noticed rather than assumed.
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client
      - name: capture and diff
        run: |
          npm run capture:traces
          git diff --stat -- test/protocol/fixtures/
